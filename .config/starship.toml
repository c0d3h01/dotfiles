"$schema" = 'https://starship.rs/config-schema.json'

scan_timeout = 1000

# macOS default look: machine name, path, git, then % on a new line
format = """
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$character"""

[hostname]
format = "[$hostname](bold dimmed white) "
# scutil reports the .local domain, macOS prompt does not show it
ssh_only = false

[directory]
format = "[$path]($style) "
style = "blue dimmed"
truncate_to_repo = false

[git_branch]
format = "on [$branch]($style) "
style = "green"

[git_state]
format = '[$state( $progress_current/$progress_total)]($style) '
style = "bright-black"

[git_status]
format = "[[($conflicted$untracked$modified$staged$renamed$deleted)]($style)]($style) "
style = "bright-black"
conflicted = "!"
untracked = "?"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✗"
stashed = "$"
ahead = "⇡"
behind = "⇣"
diverged = "⇕"

[cmd_duration]
format = "[took $duration]($style) "
style = "bright-black"

[character]
success_symbol = "[%](bold green)"
error_symbol = "[%](bold red)"
vimcmd_symbol = "[%](bold yellow)"
